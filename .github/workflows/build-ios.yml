name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Application with xcodebuild
        run: |
          xcodebuild clean build \
            -project Kizyac.xcodeproj \
            -scheme Kizyac \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/Kizyac.app build/Payload/
          cd build
          zip -r -9 Kizyac.ipa Payload
          ls -lh Kizyac.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kizyac-iOS-IPA
          path: build/Kizyac.ipa
          retention-days: 30
